<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우주 슈팅 1942</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 모바일에서 스크롤 및 줌 방지 */
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 0 0 10px #00ffff;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            display: none;
            text-shadow: 0 0 5px #fff, 0 0 10px #0ff;
        }

        .screen {
            background: rgba(5, 5, 16, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #00ffff;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        h1 {
            margin-top: 0;
            font-size: 3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
        }

        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        button {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        button:hover, button:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }

        #gameOverScreen {
            display: none;
        }

        #finalScore {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">점수: <span id="scoreDisplay">0</span></div>

    <div class="ui-layer" id="uiLayer">
        <!-- 시작 화면 -->
        <div class="screen" id="startScreen">
            <h1>우주 슈팅 1942</h1>
            <p>마우스나 터치로 이동하세요. 공격은 자동!<br><span style="color:#0f0;">아이템(P)</span>을 먹으면 무기가 강화됩니다.</p>
            <button onclick="startGame()">게임 시작</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div class="screen" id="gameOverScreen">
            <h1 style="color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;">임무 실패</h1>
            <div id="finalScore">점수: 0</div>
            <button onclick="startGame()">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const hud = document.getElementById('hud');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const uiLayer = document.getElementById('uiLayer');

        let isGameRunning = false;
        let score = 0;
        let frameCount = 0;
        let animationId;

        // 화면 크기 설정 및 리사이징 이벤트
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: canvas.width / 2, y: canvas.height - 100 };
        
        function updateMousePos(e) {
            if (!isGameRunning) return;
            if (e.touches) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            } else {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }
        }
        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('touchmove', updateMousePos, {passive: false});
        window.addEventListener('touchstart', updateMousePos, {passive: false});

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = (Math.random() * 2) + 0.5;
                this.alpha = Math.random();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 50;
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.color = '#00ffff';
                this.weaponLevel = 1; // 무기 레벨 시스템
            }
            update() {
                // 부드러운 이동 (선형 보간 - LERP)
                this.x += (mouse.x - this.x) * 0.15;
                this.y += (mouse.y - this.y) * 0.15;

                // 화면 밖으로 나가지 못하게 제한
                this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
                this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 네온 효과
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                // 엔진 화염
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-10, this.height/2 - 5);
                ctx.lineTo(10, this.height/2 - 5);
                ctx.lineTo(0, this.height/2 + 20 + Math.random() * 15); // 깜빡이는 효과
                ctx.closePath();
                ctx.fill();

                // 우주선 본체
                ctx.fillStyle = '#111';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2); 
                ctx.lineTo(this.width / 2, this.height / 2); 
                ctx.lineTo(0, this.height / 4); 
                ctx.lineTo(-this.width / 2, this.height / 2); 
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                // 조종석 
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, -5, 5, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle = 0, color = '#00ffff', size = 4) {
                this.x = x;
                this.y = y;
                this.radius = size;
                this.speed = 15;
                // 각도에 따른 x, y 이동 속도 계산
                this.vx = Math.sin(angle) * this.speed;
                this.vy = -Math.cos(angle) * this.speed;
                this.color = color;
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < 0 || this.x < 0 || this.x > canvas.width) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                this.type = Math.random(); 
                if (this.type < 0.2) {
                    // 대형 적 (20%) - 체력 높음, 느림
                    this.width = 70;
                    this.height = 70;
                    this.hp = 12;
                    this.speed = (Math.random() * 1.5) + 1;
                    this.color = '#ffaa00';
                } else if (this.type < 0.4) {
                    // 고속 적 (20%) - 체력 낮음, 빠름
                    this.width = 30;
                    this.height = 30;
                    this.hp = 1;
                    this.speed = (Math.random() * 3) + 5;
                    this.color = '#ff00ff';
                } else {
                    // 일반 적 (60%)
                    this.width = 40;
                    this.height = 40;
                    this.hp = 2;
                    this.speed = (Math.random() * 2) + 2;
                    this.color = '#ff0055';
                }
                
                this.x = Math.random() * (canvas.width - this.width) + this.width/2;
                this.y = -this.height;
                this.markedForDeletion = false;
                this.angle = 0;
                this.spinSpeed = (Math.random() - 0.5) * 0.1;
                this.waveOffset = Math.random() * Math.PI * 2; 
            }
            update() {
                this.y += this.speed;
                this.x += Math.sin(this.angle + this.waveOffset) * 2.5; // 약간의 지그재그 이동
                this.angle += 0.05;
                if (this.y > canvas.height + this.height) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * this.spinSpeed * 10);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                ctx.fillStyle = '#111';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.moveTo(0, -this.height/2);
                ctx.lineTo(this.width/2, 0);
                ctx.lineTo(0, this.height/2);
                ctx.lineTo(-this.width/2, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI*2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.02;
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.speed = 2;
                this.color = '#00ff00';
                this.markedForDeletion = false;
                this.angle = 0;
            }
            update() {
                this.y += this.speed;
                this.angle += 0.05;
                if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#111';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.rect(-this.radius, -this.radius, this.radius*2, this.radius*2);
                ctx.fill();
                ctx.stroke();

                // 'P' 글자는 회전을 상쇄하여 똑바로 보이게 함
                ctx.rotate(-this.angle);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P', 0, 0);
                
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.markedForDeletion = false;
            }
            update() {
                this.y -= 1; // 위로 서서히 떠오름
                this.alpha -= 0.02; 
                if (this.alpha <= 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        let stars = [], bullets = [], enemies = [], particles = [], items = [], floatingTexts = [];
        let player;

        function init() {
            stars = [];
            for (let i = 0; i < 150; i++) stars.push(new Star());
            player = new Player();
            bullets = []; enemies = []; particles = []; items = []; floatingTexts = [];
            score = 0; frameCount = 0;
            scoreDisplay.innerText = score;
            mouse.x = canvas.width / 2;
            mouse.y = canvas.height - 100;
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) particles.push(new Particle(x, y, color));
        }

        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < (obj1.width/2 || obj1.radius) + (obj2.width/2 || obj2.radius) * 0.8;
        }

        function animate() {
            if (!isGameRunning) return;
            animationId = requestAnimationFrame(animate);
            
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter'; // 블렌딩 모드로 화려하게 처리

            // 배경 별
            stars.forEach(star => { star.update(); star.draw(); });

            // 플레이어
            player.update();
            player.draw();

            frameCount++;

            // 무기 레벨에 따른 발사 패턴
            if (frameCount % 10 === 0) {
                if (player.weaponLevel === 1) {
                    bullets.push(new Bullet(player.x - 15, player.y - 20));
                    bullets.push(new Bullet(player.x + 15, player.y - 20));
                } else if (player.weaponLevel === 2) {
                    bullets.push(new Bullet(player.x - 20, player.y - 15, -0.1));
                    bullets.push(new Bullet(player.x, player.y - 30, 0));
                    bullets.push(new Bullet(player.x + 20, player.y - 15, 0.1));
                } else if (player.weaponLevel === 3) {
                    bullets.push(new Bullet(player.x - 25, player.y - 10, -0.2, '#ff00ff', 5));
                    bullets.push(new Bullet(player.x - 12, player.y - 25, -0.1, '#ff00ff', 5));
                    bullets.push(new Bullet(player.x + 12, player.y - 25, 0.1, '#ff00ff', 5));
                    bullets.push(new Bullet(player.x + 25, player.y - 10, 0.2, '#ff00ff', 5));
                } else { // 레벨 4 (MAX)
                    bullets.push(new Bullet(player.x - 30, player.y - 10, -0.3, '#ffff00', 6));
                    bullets.push(new Bullet(player.x - 15, player.y - 25, -0.15, '#ffff00', 6));
                    bullets.push(new Bullet(player.x, player.y - 35, 0, '#ffff00', 7));
                    bullets.push(new Bullet(player.x + 15, player.y - 25, 0.15, '#ffff00', 6));
                    bullets.push(new Bullet(player.x + 30, player.y - 10, 0.3, '#ffff00', 6));
                }
            }

            // 적 생성 주기 (점수가 오를수록 빨리 생성)
            const enemySpawnRate = Math.max(20, 60 - Math.floor(score / 500));
            if (frameCount % enemySpawnRate === 0) enemies.push(new Enemy());

            bullets.forEach((bullet, index) => {
                bullet.update(); bullet.draw();
                if (bullet.markedForDeletion) bullets.splice(index, 1);
            });

            enemies.forEach((enemy, eIndex) => {
                enemy.update(); enemy.draw();

                // 적과 플레이어 충돌
                if (checkCollision(player, enemy)) {
                    createExplosion(player.x, player.y, '#00ffff');
                    createExplosion(enemy.x, enemy.y, '#ff0055');
                    gameOver();
                }

                // 총알과 적 충돌
                bullets.forEach((bullet, bIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        bullet.markedForDeletion = true;
                        
                        // 무기 레벨이 높을수록 데미지 증가
                        let damage = 1 + (player.weaponLevel * 0.2); 
                        enemy.hp -= damage;
                        
                        createExplosion(bullet.x, bullet.y, '#ffffff');

                        if (enemy.hp <= 0 && !enemy.markedForDeletion) {
                            enemy.markedForDeletion = true;
                            createExplosion(enemy.x, enemy.y, enemy.color);
                            
                            // 적 종류별 점수 다르게 부여
                            let points = enemy.type < 0.2 ? 300 : (enemy.type < 0.4 ? 200 : 100);
                            score += points;
                            scoreDisplay.innerText = score;
                            
                            // 획득 점수 텍스트 표시
                            floatingTexts.push(new FloatingText(enemy.x, enemy.y, `+${points}`, enemy.color));

                            // 아이템 드랍 확률 (대형 적은 40%, 나머지는 10%)
                            let dropChance = enemy.type < 0.2 ? 0.4 : 0.1;
                            if (Math.random() < dropChance) items.push(new Item(enemy.x, enemy.y));
                        }
                    }
                });

                if (enemy.markedForDeletion) enemies.splice(eIndex, 1);
            });

            // 아이템 획득 처리
            items.forEach((item, index) => {
                item.update(); item.draw();
                if (checkCollision(player, item)) {
                    item.markedForDeletion = true;
                    createExplosion(item.x, item.y, '#00ff00');
                    
                    if (player.weaponLevel < 4) {
                        player.weaponLevel++;
                        floatingTexts.push(new FloatingText(player.x, player.y - 40, "POWER UP!", "#00ff00"));
                    } else {
                        score += 1000;
                        scoreDisplay.innerText = score;
                        floatingTexts.push(new FloatingText(player.x, player.y - 40, "BONUS +1000", "#ffff00"));
                    }
                }
                if (item.markedForDeletion) items.splice(index, 1);
            });

            floatingTexts.forEach((text, index) => {
                text.update(); text.draw();
                if (text.markedForDeletion) floatingTexts.splice(index, 1);
            });

            particles.forEach((particle, index) => {
                particle.update(); particle.draw();
                if (particle.alpha <= 0) particles.splice(index, 1);
            });

            ctx.globalCompositeOperation = 'source-over';
        }

        function startGame() {
            init();
            isGameRunning = true;
            uiLayer.style.pointerEvents = 'none';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            hud.style.display = 'block';
            animate();
        }

        function gameOver() {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            
            uiLayer.style.pointerEvents = 'auto';
            hud.style.display = 'none';
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.innerText = `최종 점수: ${score}`;
        }

        window.onload = () => {
            init();
            function backgroundLoop() {
                if(isGameRunning) return;
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    star.update();
                    star.draw();
                });
                requestAnimationFrame(backgroundLoop);
            }
            backgroundLoop();
        }
    </script>
</body>
</html>
